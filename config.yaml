data:
  dataset: CIFAR10
  data_dir: ./data
  channels: 3
  num_classes: 10

training:
  batch_size: 128
  num_epochs: 15
  learning_rate: 0.0001
  random_seed: 42
  optimizer: adam
  delta: 0.001
  patience: 5

model:
  architecture: ResNet18
  pretrained: true
  freeze_backbone: false
  input_size: 224

paths:
  models_dir: ./outputs/models
  figures_dir: ./outputs/figures
