[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-cifar-10"
version = "0.1.0"
description = "CNN CIFAR-10 - DL Learning with PyTorch"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cnn_cifar_10*"]

[tool.ruff]
line-length = 150
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]